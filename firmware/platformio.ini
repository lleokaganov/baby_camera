; Baby monitor on AI-Thinker ESP32-CAM (HW-297) + INMP441 I2S microphone.
;
; Pinned to platform 6.5.0 on purpose: it maps to Arduino-ESP32 core 2.0.14,
; which is already present in ~/.platformio (no download needed) and still
; ships the legacy driver/i2s.h. Core 3.x replaced that API wholesale; the
; rewrite buys nothing here and would have to be re-verified against the
; camera driver, which owns I2S0.

[env:esp32cam]
platform  = espressif32@6.5.0
board     = esp32cam
framework = arduino

monitor_speed = 115200
upload_speed  = 460800

; The camera driver plus three HTTP servers do not fit the default app
; partition; huge_app gives ~3 MB for the binary and drops OTA.
board_build.partitions = huge_app.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=1
